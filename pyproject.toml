[project]
name = "SE-adLIF"
version = "0.1.0"
description = "Spiking Equilibrium adLIF"
requires-python = "==3.11.14"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "pytorch-lightning==2.2.1",
    "hydra-core==1.3.2",
    "matplotlib",
    "auraloss==0.4.0",
    "librosa==0.10.2",
    "tonic",
    "jax[cuda]>=0.5.3 ; sys_platform == 'linux'",
    "pandas>=2.3.3",
    "jupyter>=1.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124"},
]
torchvision = [
  { index = "pytorch-cu124"},
]
