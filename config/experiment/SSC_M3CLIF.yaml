# @package _global_

defaults:
  - /dataset: ssc

exp_name: SSC_3MCLIF


# Whether to use a two-layer network
two_layers: true
# SLAYER parameters
alpha: 5.0
c: 0.4
dt: 1.0
# Dropout rate
dropout: 0.15
l1:
  # Which cell to use
  cell: mclif_v2
# input size of preprocessed SSC
  input_size: 140
  # number of neurons
  n_neurons: 480
  # tau ranges
  tau_u_range: [5, 25]
  tau_d_range: [1, 20]
  tau_t_range: [1, 60]
  # mc params
  num_compartments: 3
  epsilon: 0.2
  train_u_p: True
  u_p: 0.6
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l2:
  # Which cell to use
  cell: mclif_v2
  input_size: 480
  # number of neurons
  n_neurons: 512
  # tau ranges
  tau_u_range: [5, 25]
  tau_d_range: [1, 20]
  tau_t_range: [1, 60]
  # mc params
  num_compartments: 3
  epsilon: 0.2
  train_u_p: True
  u_p: 0.6
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l_out:
  input_size: 512
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [15, 15]
  dt: ${dt}

# Batch size
batch_size: 256
# Number of epochs
n_epochs: 40
# Loss aggregation
loss_agg: mean_membrane_potentials

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 6e-3
factor: 0.9
patience: 9999

