# @package _global_

defaults:
  - /dataset: ssc

exp_name: SSC_M2CLIF


# Whether to use a two-layer network
two_layers: true
# SLAYER parameters
alpha: 5.0
c: 0.4
dt: 1.0
# Dropout rate
dropout: 0.15
l1:
  # Which cell to use
  cell: mclif_v2
# input size of preprocessed SSC
  input_size: 140
  # number of neurons
  n_neurons: 480
  # Range of tau_u
  tau_u_range: [5, 25]
  train_tau_u_method: sigmoid
  tau_d_range: [5, 20]
  train_tau_d_method: sigmoid
  tau_t_range: [1, 60]
  train_tau_t_method: sigmoid
  # mc params
  recurrent_dendrite: True
  active_dendrite: True
  passive_dendrite: True
  proximal_dendrite: True
  train_d_thr: False
  soma_to_dendrite_recurrence: False
  soma_to_dendrite_full_recurrence: False
  num_compartments: 2
  epsilon: 0.001
  train_u_p: True
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l2:
  # Which cell to use
  cell: mclif_v2
  input_size: 480
  # number of neurons
  n_neurons: 560
  # Range of tau_u
  tau_u_range: [5, 25]
  train_tau_u_method: sigmoid
  tau_d_range: [5, 20]
  train_tau_d_method: sigmoid
  tau_t_range: [1, 60]
  train_tau_t_method: sigmoid
  # mc params
  recurrent_dendrite: True
  active_dendrite: True
  passive_dendrite: True
  proximal_dendrite: True
  train_d_thr: False
  soma_to_dendrite_recurrence: False
  soma_to_dendrite_full_recurrence: False
  num_compartments: 2
  epsilon: 0.001
  train_u_p: True
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l_out:
  input_size: 560
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [15, 15]
  dt: ${dt}

# Batch size
batch_size: 256
# Number of epochs
n_epochs: 40
# Loss aggregation
loss_agg: mean_membrane_potentials

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 6e-3
factor: 0.9
patience: 9999

