# @package _global_

defaults:
  - /dataset: fwd

exp_name: FWD_ResNet_LIF
model_type: resnet

# SLAYER parameters (used by all neuron layers)
alpha: 5.0
c: 0.1
dt: 1.0

# Dropout rate
dropout: 0.3

# ResNet specific configuration
resnet:
  # Input spatial dimensions for CIFAR-10 DVS
  input_height: 48
  input_width: 48
  
  # Initial convolution layer
  initial_conv:
    in_channels: 2
    out_channels: 64
    kernel_size: 7
    stride: 1
    padding: 1
    bias: true
  
  # Residual stages configuration
  # Each stage has multiple residual blocks with neuron convolutions
  stages:
    - num_blocks: 2
      out_channels: 64
      stride: 1
      kernel_size: 3
      padding: 1
      neuron_cell: lif
    - num_blocks: 2
      out_channels: 128
      stride: 2
      kernel_size: 3
      padding: 1
      neuron_cell: lif
    - num_blocks: 2
      out_channels: 256
      stride: 2
      kernel_size: 3
      padding: 1
      neuron_cell: lif
  
  # Global average pooling before output
  global_avg_pool: true
  
  # Output layer
  output_size: ${dataset.num_classes}

# Neuron configuration (shared across all blocks)
neuron_cfg:
  cell: lif
  # Range of tau_u
  tau_u_range: [2, 20]
  use_recurrent: false
  convolutional: true
  alpha: 5.0
  c: 0.1
  dt: 1.0

# Output layer configuration
l_out:
  input_size: 256  # channels from last stage
  n_neurons: ${dataset.num_classes}
  tau_u_range: [15, 15]
  dt: 1.0

# Training parameters
n_epochs: 300
batch_size: 256

# Loss aggregation
loss_agg: softmax

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# Optimizer parameters
lr: 0.01
factor: 0.9
patience: 9999
