# @package _global_

defaults:
  - /dataset: cifar10dvs

exp_name: CIFAR_LIF
# Whether to use a two-layer network
two_layers: True
# SLAYER parameters
alpha: 5.0
c: 0.1
dt: 1.0
# Dropout rate
dropout: 0.15

l1:
  # Which cell to use
  cell: lif
  # input size of preprocessed SHD
  convolutional: True
  input_size: 2
  n_neurons: 32
  kernel_size: 3
  stride: 1
  padding: 1
  # Range of tau_u
  tau_u_range: [5, 25]
  use_recurrent: False
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l2:
  # Which cell to use
  cell: lif
  # input size of preprocessed SHD
  convolutional: True
  input_size: 32
  n_neurons: 64
  kernel_size: 3
  stride: 1
  padding: 1
  # Range of tau_u
  tau_u_range: [5, 25]
  use_recurrent: False
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l_out:
  input_size: 64 # after global avg pooling ofc
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [15, 15]
  dt: ${dt}

# Number of epochs
n_epochs: 300

# Batch size
batch_size: 256

# Loss aggregation
loss_agg: softmax

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 0.01
factor: 0.9
patience: 9999
