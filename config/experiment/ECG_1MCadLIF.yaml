# @package _global_

defaults:
  - /dataset: ecg

exp_name: ECG_MC1adLIF
# Whether to use a two-layer network
two_layers: true

# Parameters of SLAYER
alpha: 5
c: 0.2
dt: 1.0

l1:
  # Which cell to use
  cell: mcalif
# input size of preprocessed SHD
  input_size: 4
  # number of neurons
  n_neurons: 26
  # tau ranges
  tau_u_range: [5, 25]
  train_tau_u_method: sigmoid
  tau_d_range: [5, 20]
  train_tau_d_method: sigmoid
  tau_t_range: [1, 60]
  train_tau_t_method: sigmoid
  # Range of tau_w
  tau_w_range: [60, 300]
  train_tau_w_method: sigmoid
  # Factor for reparametrization of a and b (see paper)
  q: 120
  # mc params
  # use_soft_reset: True
  recurrent_dendrite: True
  num_compartments: 1
  epsilon: 0.2
  train_u_p: True
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}

l2:
  # Which cell to use
  cell: mcalif
  input_size: 26
  # number of neurons
  n_neurons: 34
  # tau ranges
  tau_u_range: [5, 25]
  train_tau_u_method: sigmoid
  tau_d_range: [5, 20]
  train_tau_d_method: sigmoid
  tau_t_range: [1, 60]
  train_tau_t_method: sigmoid
  # Range of tau_w
  tau_w_range: [60, 300]
  train_tau_w_method: sigmoid
  # Factor for reparametrization of a and b (see paper)
  q: 120
  # mc params
  # use_soft_reset: True
  recurrent_dendrite: True
  num_compartments: 1
  epsilon: 0.2
  train_u_p: True
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}

l_out:
  input_size: 34
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [3, 3]
  dt: ${dt}

# Number of epochs
n_epochs: 400

# Dropout rate
dropout: 0.15

# Batch size
batch_size: 64

# Loss aggregation
loss_agg: summed_membrane_potentials

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 0.01
factor: 0.9
patience: 9999 # no lr decay

