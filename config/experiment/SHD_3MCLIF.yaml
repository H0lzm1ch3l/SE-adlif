# @package _global_

defaults:
  - /dataset: shd_val

exp_name: SHD_3MCLIF
# Whether to use a two-layer network
two_layers: True
# SLAYER parameters
alpha: 5.0
c: 0.1
dt: 1.0
# Dropout rate
dropout: 0.15

l1:
  # Which cell to use
  cell: mclif_v2
  # input size of preprocessed SHD
  input_size: 140
  # number of neurons
  n_neurons: 220
  # tau ranges
  tau_u_range: [5, 25]
  train_tau_u_method: sigmoid
  tau_d_range: [5, 20]
  train_tau_d_method: sigmoid
  tau_t_range: [1, 60]
  train_tau_t_method: sigmoid
  # mc params
  recurrent_dendrite: True
  num_compartments: 3
  epsilon: 0.2
  train_u_p: True
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l2:
  # Which cell to use
  cell: mclif_v2
  input_size: 220
  # number of neurons
  n_neurons: 240
  # tau ranges
  tau_u_range: [5, 25]
  train_tau_u_method: sigmoid
  tau_d_range: [5, 20]
  train_tau_d_method: sigmoid
  tau_t_range: [1, 60]
  train_tau_t_method: sigmoid
  # mc params
  recurrent_dendrite: True
  num_compartments: 3
  epsilon: 0.2
  train_u_p: True
  # slayer params
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l_out:
  input_size: 240
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [15, 15]
  dt: ${dt}

# Number of epochs
n_epochs: 300

# Batch size
batch_size: 256

# Loss aggregation
loss_agg: softmax

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 0.01
factor: 0.9
patience: 9999
