# @package _global_

defaults:
  - /dataset: shd

exp_name: SHD_MC1adLIF
# Whether to use a two-layer network
two_layers: True
# SLAYER parameters
alpha: 5.0
c: 0.1
dt: 1.0
# Dropout rate
dropout: 0.15

l1:
  # Which cell to use
  cell: se_adlif
# input size of preprocessed SHD
  input_size: 140
  # number of neurons
  n_neurons: 360
  tau_u_range: [5, 25]

  tau_w_range: [60, 300]
  q: 120

  alpha: ${alpha}
  c: ${c}
  dt: ${dt}

l2:
  # Which cell to use
  cell: mcalif
  input_size: 180
  # number of neurons
  n_neurons: 280

  # Range of tau_u
  tau_u_range: [5, 25]
  tau_d_range: [1, 20]
  tau_t_range: [1, 60]

  tau_w_range: [60, 300]
  q: 120

  num_compartments: 1
  epsilon: 0.2
  u_p: 0.5
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}

l_out:
  input_size: 280
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [15, 15]
  dt: ${dt}

# Number of epochs
n_epochs: 300

# Batch size
batch_size: 256

# Loss aggregation
loss_agg: softmax

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 0.01
factor: 0.9
patience: 9999
