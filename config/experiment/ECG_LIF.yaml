# @package _global_

defaults:
  - /dataset: ecg

exp_name: ECG_LIF_2layer
# Whether to use a two-layer network
two_layers: true

# Parameters of SLAYER
alpha: 5
c: 0.2
dt: 1.0

l1:
  # Which cell to use
  cell: lif
  # input size of ECG
  input_size: 4
  # number of neurons
  n_neurons: 36
  # Range of tau_u
  tau_u_range: [5, 25]
  # train_tau_u_method: sigmoid

  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l2:
  # Which cell to use
  cell: lif
  input_size: 36
  # number of neurons
  n_neurons: 38
  # range of tau_u
  tau_u_range: [5, 25]
  # train_tau_u_method: sigmoid

  # input size
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}
l_out:
  input_size: 62
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [3, 3]
  dt: ${dt}

# Number of epochs
n_epochs: 400

# Dropout rate
dropout: 0.15

# Batch size
batch_size: 64

# Loss aggregation
loss_agg: summed_membrane_potentials

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 0.01
factor: 0.9
patience: 9999 # no lr decay

