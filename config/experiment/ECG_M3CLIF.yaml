# @package _global_

defaults:
  - /dataset: ecg

exp_name: ECG_M3CLIF
# Whether to use a two-layer network
two_layers: true

# Parameters of SLAYER
alpha: 5
c: 0.2
dt: 1.0

l1:
  # Which cell to use
  cell: lif
# input size of preprocessed SHD
  input_size: 4
  # number of neurons
  n_neurons: 28
  tau_u_range: [5, 25]
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}

l2:
  # Which cell to use
  cell: mclif
  input_size: 7
  # number of neurons
  n_neurons: 24

  tau_u_range: [5, 25]
  tau_d_range: [1, 20]
  tau_t_range: [1, 60]
  train_tau_u_method: 'interpolation'
  train_tau_d_method: 'interpolation'
  train_tau_t_method: 'interpolation'
  num_compartments: 3
  epsilon: 0.2
  u_p: 0.2
  # input size
  alpha: ${alpha}
  c: ${c}
  dt: ${dt}

l_out:
  input_size: 24
  n_neurons: ${dataset.num_classes}
  # Time constant of output layer 
  tau_u_range: [3, 3]
  dt: ${dt}

# Number of epochs
n_epochs: 400

# Dropout rate
dropout: 0.15

# Batch size
batch_size: 64

# Loss aggregation
loss_agg: summed_membrane_potentials

# Metric tracking
tracking_metric: val_acc
tracking_mode: max

# optimizer parameters
# learning rate of the optimizer
lr: 0.01
factor: 0.9
patience: 9999 # no lr decay

